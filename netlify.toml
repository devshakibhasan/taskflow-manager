[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/tasks/*"
  to = "/.netlify/functions/api/tasks/:splat"
  status = 200

[[redirects]]
  from = "/tasks"
  to = "/.netlify/functions/api/tasks"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
